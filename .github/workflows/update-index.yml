name: Update Plugin Center Index (Release assets + PR index.yaml)

on:
  push:
    branches: [ main ]
    paths:
      - "plugins/**"
      - ".github/scripts/gen_index_release.py"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with PAT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Generate zips + sha256 + update index.yaml (merge versions)
        env:
          REPO_FULL_NAME: ${{ github.repository }}
          RELEASE_TAG: "artifacts"
          DEFAULT_REF: "main"
        run: |
          python .github/scripts/gen_index_release.py

      # Ensure a tag exists for the Release asset bucket.
      # We keep tag name fixed as you chose 1A.
      - name: Ensure tag "artifacts" exists (force-update)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag -f artifacts
          git push -f origin artifacts

      - name: Upload plugin zips to GitHub Release (tag=artifacts)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: artifacts
          name: Plugin Artifacts
          files: |
            dist-artifacts/*.zip
          generate_release_notes: false

      - name: Create Pull Request for index.yaml
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(index): update index.yaml"
          branch: "ci/update-index"
          title: "Update index.yaml (Release assets)"
          body: "Auto-generated index.yaml. Plugin zips uploaded to Release tag 'artifacts'."
          labels: "index, automation"
          token: ${{ secrets.GH_PAT }}
